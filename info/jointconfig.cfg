# jointanalysis configuration. Relative paths are resolved from this file's folder, which
# also holds the run pairing lists (6hepn.txt, 9lipn.txt).

# Each detector's own configuration, used unchanged: maps, cuts, raw data and beam tables.
NULIBConfig = ../../NULIB/info/tnconfig.cfg
TAccConfig = ../../TAcc/info/taconfig.cfg

# Joint output folder.
DataBoxDir = ../databox/

# Keep only pairs whose TexNeut event has an in-crystal hit of this kind:
# all, neutrons or nonneutrons. NULIB's own neutron_filter is not used here.
neutron_filter = neutrons

# Beam flight from the MARS scintillator (TDC start) to the entrance window, for nTOF.
# 185.0 mm scintillator to target minus 0.755 in window to target (run1221a_diagram.pdf).
PreGasDistance_mm = 165.823
# Total MeV after the 2 um BC-400 scintillator: MARS tune minus its loss (TAcc README,
# "Beam energies"). The in-gas flight comes from TAcc's <beam>_isobutane_vecref.txt.
PreGasEnergy_6he_MeV = 28.233
PreGasEnergy_9li_MeV = 59.792
